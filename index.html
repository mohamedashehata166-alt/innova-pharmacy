<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Innova Pharmacy</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fa;
}

header{
background:#0b7a75;
color:white;
padding:20px;
text-align:center;
}

.search{
text-align:center;
margin:20px;
}

input{
padding:10px;
width:300px;
border:1px solid #ccc;
border-radius:10px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
padding:15px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.1);
text-align:center;
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

.price{
color:#0b7a75;
font-size:20px;
font-weight:bold;
margin:10px 0;
}

button{
background:#0b7a75;
color:white;
border:none;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
}

.cart{
position:fixed;
top:20px;
left:20px;
background:white;
padding:10px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

#cartBox{
display:none;
position:fixed;
top:100px;
left:50%;
transform:translateX(-50%);
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.3);
width:300px;
}
</style>
</head>

<body>

<header>
<h1>💊 Innova Pharmacy</h1>
<p>اطلب منتجاتك بسهولة</p>
</header>

<div class="cart">
🛒 السلة: <span id="cartCount">0</span>
<br><br>
<button onclick="openCart()">عرض السلة</button>
</div>

<div class="search">
<input type="text" id="search" placeholder="ابحث عن منتج...">
</div>

<div class="products">

<div class="card">
<img src="https://via.placeholder.com/300x200">
<h3>Panadol</h3>
<p class="price">12 ﷼</p>
<button onclick="addToCart('Panadol',12)">أضف للسلة</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x200">
<h3>Vitamin C</h3>
<p class="price">35 ﷼</p>
<button onclick="addToCart('Vitamin C',35)">أضف للسلة</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x200">
<h3>Omega 3</h3>
<p class="price">89 ﷼</p>
<button onclick="addToCart('Omega 3',89)">أضف للسلة</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/300x200">
<h3>Thermometer</h3>
<p class="price">25 ﷼</p>
<button onclick="addToCart('Thermometer',25)">أضف للسلة</button>
</div>

</div>

<div id="cartBox">
<h2>سلة المشتريات</h2>

<ul id="cartItems"></ul>

<h3>الإجمالي: <span id="total">0</span> ﷼</h3>

<button onclick="checkout()">Checkout</button>
<button onclick="closeCart()">إغلاق</button>
</div>

<script>

let count = 0;
let total = 0;
let cartItems = [];

function addToCart(name,price){
count++;
total += price;
cartItems.push(name);

document.getElementById("cartCount").innerText = count;
}

function openCart(){

let list = document.getElementById("cartItems");
list.innerHTML = "";

cartItems.forEach(function(item){
list.innerHTML += "<li>"+item+"</li>";
});

document.getElementById("total").innerText = total;
document.getElementById("cartBox").style.display = "block";
}

function closeCart(){
document.getElementById("cartBox").style.display = "none";
}

function checkout(){

alert("✅ تم تأكيد الطلب");

cartItems = [];
count = 0;
total = 0;

document.getElementById("cartCount").innerText = "0";
document.getElementById("cartItems").innerHTML = "";
document.getElementById("total").innerText = "0";

closeCart();
}

document.getElementById("search").addEventListener("keyup", function(){

let value = this.value.toLowerCase();

let cards = document.querySelectorAll(".card");

cards.forEach(function(card){

card.style.display =
card.innerText.toLowerCase().includes(value)
? "block"
: "none";

});
});

</script>

</body>
</html>
