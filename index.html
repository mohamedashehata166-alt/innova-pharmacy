
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Innova Pharmacy</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fa;
    color: #222;
}

header {
    background: #0b7a75;
    color: white;
    padding: 30px 15px;
    text-align: center;
    position: relative;
}

header h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

.auth-area {
    position: absolute;
    left: 18px;
    top: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    direction: rtl;
}

.auth-btn {
    background: white;
    color: #0b7a75;
    padding: 11px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    white-space: nowrap;
}

.auth-btn:hover {
    background: #e7f5f4;
    color: #075e59;
}

.user-name {
    font-size: 13px;
    color: white;
}

.menu-btn {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 1001;
    background: white;
    color: #0b7a75;
    font-size: 27px;
    width: 45px;
    height: 45px;
    border-radius: 12px;
    box-shadow: 0 2px 10px #0002;
}

.sidebar {
    position: fixed;
    top: 0;
    right: -290px;
    width: 270px;
    height: 100%;
    background: white;
    z-index: 1002;
    padding: 25px 18px;
    box-shadow: -5px 0 20px #0002;
    transition: .3s;
    overflow-y: auto;
}

.sidebar.open {
    right: 0;
}

.sidebar h2 {
    color: #0b7a75;
    margin: 20px 0 30px;
    text-align: center;
}

.sidebar button {
    display: block;
    width: 100%;
    text-align: right;
    background: #f1f7f7;
    color: #333;
    margin-bottom: 12px;
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
}

.sidebar button.active,
.sidebar button:hover {
    background: #0b7a75;
    color: white;
}

.close-menu {
    background: #d9534f !important;
    color: white !important;
    text-align: center !important;
}

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #0007;
    z-index: 1000;
}

.overlay.show {
    display: block;
}

/* البحث والفلتر واللغة */
.search {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 25px 15px;
    direction: rtl;
}

.search input {
    padding: 14px;
    width: 90%;
    max-width: 450px;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 16px;
    outline-color: #0b7a75;
}

.filter-select,
.language-select {
    padding: 14px 12px;
    border: 1px solid #ccc;
    border-radius: 12px;
    background: white;
    color: #0b7a75;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    outline-color: #0b7a75;
}

.filter-select {
    min-width: 145px;
}

.language-select {
    min-width: 105px;
}

.section-title {
    text-align: center;
    color: #0b7a75;
    margin: 20px 0;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 20px;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 10px #0001;
    text-align: center;
    transition: .3s;
}

.card:hover {
    transform: translateY(-5px);
}

.product-icon {
    font-size: 48px;
    margin-bottom: 15px;
}

.card h3 {
    margin-bottom: 8px;
    font-size: 18px;
}

.card p {
    color: #666;
    font-size: 13px;
}

.price {
    color: #0b7a75 !important;
    font-size: 21px !important;
    font-weight: bold;
    margin: 13px 0;
}

.card button {
    width: 100%;
}

button {
    background: #0b7a75;
    color: white;
    border: none;
    padding: 11px 15px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #075e59;
}

.cart {
    position: fixed;
    bottom: 15px;
    left: 15px;
    z-index: 10;
    background: white;
    padding: 12px;
    border-radius: 12px;
    box-shadow: 0 0 10px #0002;
}

#cartCount {
    color: #0b7a75;
    font-weight: bold;
}

#cartBox {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 0 20px #0005;
    width: 92%;
    max-width: 420px;
    max-height: 80vh;
    overflow-y: auto;
    z-index: 2000;
}

#cartItems {
    margin: 20px;
    padding-right: 20px;
}

#cartItems li {
    margin-bottom: 18px;
    line-height: 2;
}

.remove-btn {
    background: #d9534f;
    padding: 6px 10px;
}

.cart-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 18px;
}

footer {
    background: #0b7a75;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 30px;
}

.empty {
    text-align: center;
    grid-column: 1 / -1;
    padding: 40px;
    color: #777;
}

/* تسجيل الدخول */
.auth-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #0008;
    z-index: 3000;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.auth-overlay.show {
    display: flex;
}

.auth-modal {
    background: white;
    width: 100%;
    max-width: 390px;
    padding: 28px 22px;
    border-radius: 16px;
    position: relative;
    text-align: center;
    box-shadow: 0 5px 25px #0003;
}

.auth-modal h2 {
    color: #0b7a75;
    margin-bottom: 10px;
}

.auth-modal p {
    color: #666;
    margin-bottom: 15px;
    font-size: 14px;
}

.auth-close {
    position: absolute;
    top: 12px;
    left: 12px;
    background: #eee;
    color: #333;
    width: 32px;
    height: 32px;
    padding: 0;
    border-radius: 50%;
    font-size: 18px;
}

.auth-modal input {
    display: block;
    width: 100%;
    padding: 13px;
    margin: 12px 0;
    border: 1px solid #ccc;
    border-radius: 9px;
    font-size: 15px;
    outline-color: #0b7a75;
}

.auth-submit {
    width: 100%;
    padding: 13px;
    margin-top: 5px;
}

.auth-switch {
    background: transparent;
    color: #0b7a75;
    margin-top: 12px;
    padding: 8px;
}

.auth-switch:hover {
    background: #eef8f7;
}

.auth-message {
    margin-top: 12px;
    font-size: 13px;
    color: #0b7a75;
    line-height: 1.6;
}

@media(max-width:600px) {
    .products {
        grid-template-columns: repeat(2, minmax(0,1fr));
        gap: 12px;
        padding: 12px;
    }

    .card {
        padding: 13px;
    }

    .card h3 {
        font-size: 15px;
    }

    .product-icon {
        font-size: 38px;
    }

    header {
        padding: 75px 15px 25px;
    }

    .auth-area {
        top: 15px;
        left: 15px;
    }

    .user-name {
        max-width: 100px;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .search {
        gap: 6px;
        margin: 20px 8px;
    }

    .search input {
        width: auto;
        min-width: 0;
        flex: 1;
        padding: 13px 7px;
        font-size: 13px;
    }

    .filter-select {
        min-width: 105px;
        max-width: 125px;
        padding: 13px 5px;
        font-size: 11px;
    }

    .language-select {
        min-width: 75px;
        padding: 13px 4px;
        font-size: 11px;
    }
}

/* الاتجاه الإنجليزي */
html[dir="ltr"] .sidebar {
    right: auto;
    left: -290px;
}

html[dir="ltr"] .sidebar.open {
    left: 0;
}

html[dir="ltr"] .sidebar button {
    text-align: left;
}

html[dir="ltr"] .sidebar h2 {
    direction: ltr;
}

html[dir="ltr"] .search {
    direction: ltr;
}

html[dir="ltr"] #cartItems {
    padding-right: 0;
    padding-left: 20px;
}

html[dir="ltr"] .cart {
    left: auto;
    right: 15px;
}

html[dir="ltr"] .auth-area {
    direction: ltr;
}

</style>
</head>

<body>

<button class="menu-btn" onclick="openMenu()">⋮</button>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<div class="sidebar" id="sidebar">

    <h2>💊 Innova Pharmacy</h2>

    <button class="active" data-category="all" onclick="showCategory('all',this)">🛍️ كل المنتجات</button>
    <button data-category="medicine" onclick="showCategory('medicine',this)">💊 الأدوية</button>
    <button data-category="vitamins" onclick="showCategory('vitamins',this)">💪 الفيتامينات</button>
    <button data-category="devices" onclick="showCategory('devices',this)">💉 الأجهزة الطبية</button>
    <button data-category="care" onclick="showCategory('care',this)">🧴 العناية الشخصية</button>
    <button data-category="kids" onclick="showCategory('kids',this)">👶 الأطفال</button>

    <button class="close-menu" id="closeMenuBtn" onclick="closeMenu()">إغلاق القائمة ✖</button>

</div>

<header>

    <div class="auth-area">
        <button class="auth-btn" id="authButton" onclick="openAuth()">تسجيل الدخول</button>
        <span class="user-name" id="userName"></span>
    </div>

    <h1>💊 Innova Pharmacy</h1>
    <p id="headerSubtitle">صحتك تهمنا - اطلب منتجاتك بسهولة</p>
</header>

<!-- البحث والفلتر وتغيير اللغة -->
<div class="search">

    <input type="text" id="search" placeholder="🔍 ابحث عن اسم المنتج...">

    <select id="sortFilter" class="filter-select" aria-label="ترتيب المنتجات">
        <option value="default">⚙️ ترتيب المنتجات</option>
        <option value="priceLow">💰 السعر: الأقل أولاً</option>
        <option value="priceHigh">💰 السعر: الأعلى أولاً</option>
        <option value="nameAZ">🔤 الاسم: أ - ي</option>
        <option value="nameZA">🔤 الاسم: ي - أ</option>
    </select>

    <!-- زر اللغة في الشمال -->
    <select id="languageSelect" class="language-select" onchange="changeLanguage(this.value)">
        <option value="ar">🇸🇦 عربي</option>
        <option value="en">🇬🇧 English</option>
    </select>

</div>

<h2 class="section-title" id="categoryTitle">🛍️ جميع المنتجات</h2>

<div class="products" id="products"></div>

<div class="cart" id="cart">
    <span id="cartLabel">🛒 السلة:</span>
    <span id="cartCount">0</span>
    <br><br>
    <button id="viewCartBtn" onclick="openCart()">عرض السلة</button>
</div>

<div id="cartBox">

    <h2 id="cartTitle">🛒 سلة المشتريات</h2>

    <ul id="cartItems"></ul>

    <h3>
        <span id="totalLabel">الإجمالي:</span>
        <span id="total">0</span> ﷼
    </h3>

    <div class="cart-actions">
        <button id="checkoutBtn" onclick="checkout()">📱 طلب عبر واتساب</button>
        <button id="closeCartBtn" onclick="closeCart()">إغلاق</button>
    </div>

</div>

<div class="auth-overlay" id="authOverlay" onclick="closeAuthOutside(event)">
    <div class="auth-modal">

        <button class="auth-close" onclick="closeAuth()">✕</button>

        <h2 id="authTitle">تسجيل الدخول</h2>
        <p id="authWelcome">أهلاً بك في Innova Pharmacy 💚</p>

        <form id="authForm" onsubmit="handleAuth(event)">

            <input type="text" id="authName" placeholder="الاسم" style="display:none">

            <input type="email" id="authEmail" placeholder="البريد الإلكتروني" required>

            <input type="password" id="authPassword" placeholder="كلمة المرور" minlength="4" required>

            <button type="submit" class="auth-submit" id="authSubmit">دخول</button>

        </form>

        <button class="auth-switch" id="authSwitch" onclick="toggleAuthMode()">
            ليس لديك حساب؟ إنشاء حساب
        </button>

        <div class="auth-message" id="authMessage"></div>

    </div>
</div>

<footer>
    <h2>💊 Innova Pharmacy</h2>
    <p id="footerThanks">شكراً لزيارتكم ❤️</p>
    <br>
    <p id="footerPriority">صحتك أولويتنا</p>
</footer>

function t(key) {
    return translations[currentLanguage][key] || key;
}

function changeLanguage(language) {

    currentLanguage = language;
    localStorage.setItem("innovaLanguage", language);

    const isArabic = language === "ar";

    document.documentElement.lang = language;
    document.documentElement.dir = isArabic ? "rtl" : "ltr";

    document.getElementById("languageSelect").value = language;

    document.getElementById("headerSubtitle").textContent = t("subtitle");

    document.getElementById("authWelcome").textContent = t("authWelcome");

    document.getElementById("search").placeholder = t("search");

    const sort = document.getElementById("sortFilter");
    sort.options[0].text = t("sort");
    sort.options[1].text = t("low");
    sort.options[2].text = t("high");
    sort.options[3].text = t("az");
    sort.options[4].text = t("za");

    document.getElementById("closeMenuBtn").textContent = t("closeMenu");

    document.getElementById("cartLabel").textContent = t("cart");
    document.getElementById("viewCartBtn").textContent = t("viewCart");
    document.getElementById("cartTitle").textContent = t("cartTitle");
    document.getElementById("totalLabel").textContent = t("total");
    document.getElementById("checkoutBtn").textContent = t("checkout");
    document.getElementById("closeCartBtn").textContent = t("close");

    document.getElementById("footerThanks").textContent = t("thanks");
    document.getElementById("footerPriority").textContent = t("priority");

    document.getElementById("authName").placeholder = t("name");
    document.getElementById("authEmail").placeholder = t("email");
    document.getElementById("authPassword").placeholder = t("password");

    document.querySelector('[data-category="all"]').textContent = t("all");
    document.querySelector('[data-category="medicine"]').textContent = t("medicine");
    document.querySelector('[data-category="vitamins"]').textContent = t("vitamins");
    document.querySelector('[data-category="devices"]').textContent = t("devices");
    document.querySelector('[data-category="care"]').textContent = t("care");
    document.querySelector('[data-category="kids"]').textContent = t("kids");

    document.getElementById("categoryTitle").textContent = categoryNames[currentCategory];

    document.getElementById("authButton").textContent =
        localStorage.getItem("innovaCurrentUser") ? t("logout") : t("login");

    resetAuthMode();
    renderProducts();

    if(document.getElementById("cartBox").style.display === "block") {
        openCart();
    }

    loadLoggedUser();
}

// ==================================
// عرض المنتجات والفلترة
// ==================================

let currentCategory = "all";
let cartItems = [];

const productsContainer = document.getElementById("products");

const categoryNames = {
    all: "🛍️ جميع المنتجات",
    medicine: "💊 الأدوية",
    vitamins: "💪 الفيتامينات",
    devices: "💉 الأجهزة الطبية",
    care: "🧴 العناية الشخصية",
    kids: "👶 منتجات الأطفال"
};

function renderProducts() {

    productsContainer.innerHTML = "";

    let searchValue = document.getElementById("search").value.toLowerCase().trim();
    let sortValue = document.getElementById("sortFilter").value;

    let filtered = products.filter(product => {

        let categoryMatch =
            currentCategory === "all" ||
            product.category === currentCategory;

        let searchMatch =
            product.name.toLowerCase().includes(searchValue);

        return categoryMatch && searchMatch;
    });

    if(sortValue === "priceLow") {
        filtered.sort((a,b) => a.price - b.price);
    }
    else if(sortValue === "priceHigh") {
        filtered.sort((a,b) => b.price - a.price);
    }
    else if(sortValue === "nameAZ") {
        filtered.sort((a,b) => a.name.localeCompare(b.name, "en"));
    }
    else if(sortValue === "nameZA") {
        filtered.sort((a,b) => b.name.localeCompare(a.name, "en"));
    }

    if(filtered.length === 0) {
        productsContainer.innerHTML =
            `<div class="empty">${t("noProducts")}</div>`;
        return;
    }

    filtered.forEach(product => {

        let card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="product-icon">${product.icon}</div>
            <h3>${product.name}</h3>
            <p>${t("productDescription")}</p>
            <p class="price">${product.price} ﷼</p>
            <button>${t("add")}</button>
        `;

        card.querySelector("button").addEventListener("click", () => {
            addToCart(product.name, product.price);
        });

        productsContainer.appendChild(card);
    });
}

// ==================================
// السلة
// ==================================

function addToCart(name, price) {

    let existing = cartItems.find(item => item.name === name);

    if(existing) {
        existing.quantity++;
    } else {
        cartItems.push({
            name: name,
            price: price,
            quantity: 1
        });
    }

    updateCart();
}

function updateCart() {

    let count = cartItems.reduce(
        (sum,item) => sum + item.quantity, 0
    );

    document.getElementById("cartCount").innerText = count;
}

function openCart() {

    let list = document.getElementById("cartItems");
    let total = 0;

    list.innerHTML = "";

    if(cartItems.length === 0) {
        list.innerHTML = `<li>${t("empty")}</li>`;
    }

    cartItems.forEach((item,index) => {

        let subtotal = item.price * item.quantity;
        total += subtotal;

        let li = document.createElement("li");

        li.innerHTML = `
            <strong>${item.name}</strong>
            <br>
            ${t("price")} ${item.price} ﷼
            <br>
            ${t("quantity")} ${item.quantity}
            <br>
            <button onclick="changeQuantity(${index},1)">+</button>
            <button onclick="changeQuantity(${index},-1)">-</button>
            <button class="remove-btn" onclick="removeItem(${index})">${t("delete")}</button>
        `;

        list.appendChild(li);
    });

    document.getElementById("total").innerText = total;
    document.getElementById("cartBox").style.display = "block";
}

function changeQuantity(index,amount) {

    cartItems[index].quantity += amount;

    if(cartItems[index].quantity <= 0) {
        cartItems.splice(index,1);
    }

    updateCart();
    openCart();
}

function removeItem(index) {

    cartItems.splice(index,1);

    updateCart();
    openCart();
}

function closeCart() {
    document.getElementById("cartBox").style.display = "none";
}

// ==================================
// الطلب عبر واتساب
// ==================================

function checkout() {

    if(cartItems.length === 0) {
        alert(t("emptyCartAlert"));
        return;
    }

    let message = "🛒 New order from Innova Pharmacy\n\n";
    let total = 0;

    cartItems.forEach(item => {

        let subtotal = item.price * item.quantity;
        total += subtotal;

        message +=
            "• " + item.name +
            " × " + item.quantity +
            " = " + subtotal + " SAR\n";
    });

    message += "\n💰 Total: " + total + " SAR";

    window.open(
        "https://wa.me/201016528369?text=" +
        encodeURIComponent(message),
        "_blank"
    );
}

// ==================================
// تسجيل الدخول وإنشاء الحساب
// ==================================

let isRegisterMode = false;

function openAuth() {

    const savedUser = localStorage.getItem("innovaCurrentUser");

    if(savedUser) {
        logout();
        return;
    }

    document.getElementById("authOverlay").classList.add("show");
    document.getElementById("authMessage").textContent = "";
}

function closeAuth() {
    document.getElementById("authOverlay").classList.remove("show");
}

function closeAuthOutside(event) {
    if(event.target.id === "authOverlay") {
        closeAuth();
    }
}

function toggleAuthMode() {

    isRegisterMode = !isRegisterMode;

    document.getElementById("authTitle").textContent =
        isRegisterMode ? t("registerTitle") : t("login");

    document.getElementById("authName").style.display =
        isRegisterMode ? "block" : "none";

    document.getElementById("authName").required = isRegisterMode;

    document.getElementById("authSubmit").textContent =
        isRegisterMode ? t("register") : t("enter");

    document.getElementById("authSwitch").textContent =
        isRegisterMode ? t("switchLogin") : t("switchRegister");

    document.getElementById("authMessage").textContent = "";
}

function handleAuth(event) {

    event.preventDefault();

    const name = document.getElementById("authName").value.trim();
    const email = document.getElementById("authEmail").value.trim().toLowerCase();
    const password = document.getElementById("authPassword").value;

    let users = JSON.parse(localStorage.getItem("innovaUsers") || "[]");

    if(isRegisterMode) {

        if(!name) {
            showAuthMessage(t("writeName"));
            return;
        }

        if(users.some(user => user.email === email)) {
            showAuthMessage(t("emailExists"));
            return;
        }

        users.push({
            name: name,
            email: email,
            password: password
        });

        localStorage.setItem("innovaUsers", JSON.stringify(users));

        loginSuccess(name,email);

    } else {

        const user = users.find(user =>
            user.email === email && user.password === password
        );

        if(!user) {
            showAuthMessage(t("wrongLogin"));
            return;
        }

        loginSuccess(user.name,user.email);
    }
}

function showAuthMessage(message) {
    document.getElementById("authMessage").textContent = message;
}

function loginSuccess(name,email) {

    const user = {name: name, email: email};

    localStorage.setItem("innovaCurrentUser", JSON.stringify(user));

    updateAuthUI(user);

    closeAuth();

    document.getElementById("authForm").reset();

    isRegisterMode = false;
    resetAuthMode();
}

function updateAuthUI(user) {

    const button = document.getElementById("authButton");
    const nameLabel = document.getElementById("userName");

    if(user) {
        button.textContent = t("logout");
        nameLabel.textContent = t("hello") + user.name;
    } else {
        button.textContent = t("login");
        nameLabel.textContent = "";
    }
}

function logout() {
    localStorage.removeItem("innovaCurrentUser");
    updateAuthUI(null);
}

function resetAuthMode() {

    document.getElementById("authTitle").textContent = t("login");
    document.getElementById("authName").style.display = "none";
    document.getElementById("authName").required = false;
    document.getElementById("authSubmit").textContent = t("enter");
    document.getElementById("authSwitch").textContent = t("switchRegister");
    document.getElementById("authMessage").textContent = "";
}

function loadLoggedUser() {

    const savedUser = localStorage.getItem("innovaCurrentUser");

    if(savedUser) {
        try {
            updateAuthUI(JSON.parse(savedUser));
        } catch(error) {
            localStorage.removeItem("innovaCurrentUser");
            updateAuthUI(null);
        }
    } else {
        updateAuthUI(null);
    }
}

document.getElementById("languageSelect").value = currentLanguage;

renderProducts();

changeLanguage(currentLanguage);
